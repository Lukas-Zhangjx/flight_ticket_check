name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  # collect.yml's own commit uses the default GITHUB_TOKEN, and GitHub does
  # not let GITHUB_TOKEN-authored pushes trigger other workflows' `push`
  # events - so data/** changes have to be picked up via workflow_run instead.
  workflow_run:
    workflows: ["Daily fare collector"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Stage site (web/ + data/ side by side, as the frontend expects)
        run: |
          mkdir -p _site
          cp -r web/. _site/
          mkdir -p _site/data
          cp -r data/. _site/data/ 2>/dev/null || echo "no data/ yet"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
