name: Fare collector

on:
  schedule:
    # Every ~12h, off the hour per SPEC.md section 6. Travelpayouts' cache
    # coverage per single query is sparse and unpredictable (sometimes 1
    # date out of 90 has a price, sometimes a dozen) - running twice a day
    # instead of once roughly doubles how fast real coverage accumulates
    # across data/snapshots, since the frontend now merges all of them.
    - cron: "17 6 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run collector
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          # Phase 5: once both are set, the collector reads its watchlist
          # from the Worker's KV instead of collector/watchlist.json.
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
        run: python3 collector/collect.py

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -f: data/ is gitignored so local dry-run output never gets
          # committed by accident, but this workflow's output is real and
          # must be force-added past that same rule.
          git add -f data/
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "Update fare data $(date -u +%Y-%m-%d)"

          # The concurrency group above should keep runs from overlapping,
          # but an overlapping manual trigger (seen in practice) can still
          # race two runs' pushes against each other - retry with a rebase
          # pull rather than failing the whole job over a simple ff-reject.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), pulling and retrying"
            git pull --rebase origin main
          done
          echo "::error::push still failing after retries"
          exit 1
