name: Daily fare collector

on:
  schedule:
    # 06:17 UTC daily, off the hour per SPEC.md section 6
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run collector
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          # Phase 5: once both are set, the collector reads its watchlist
          # from the Worker's KV instead of collector/watchlist.json.
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
        run: python3 collector/collect.py

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -f: data/ is gitignored so local dry-run output never gets
          # committed by accident, but this workflow's output is real and
          # must be force-added past that same rule.
          git add -f data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "Update fare data $(date -u +%Y-%m-%d)"
            git push
          fi
